<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coddy - Aprender a Programar</title>
<style>
:root{--bg:#0f1419;--bg2:#161b22;--border:#21262d;--text:#e6edf3;--muted:#8b949e;--accent:#58a6ff;--gold:#f7df1e;--red:#ff7b72;--green:#3fb950}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.app{max-width:1200px;margin:0 auto;padding:20px}
.header{display:flex;justify-content:space-between;align-items:center;padding:16px 0;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--bg);z-index:50}
.logo{font-size:24px;font-weight:700;color:var(--accent)}
.stats{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.stat{text-align:center;cursor:pointer;transition:transform .15s}
.stat:hover{transform:translateY(-2px)}
.stat-val{font-size:20px;font-weight:700;color:var(--gold)}
.stat-lbl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.streak{display:flex;align-items:center;gap:5px;color:var(--red)}
.theme-toggle{background:var(--bg2);border:1px solid var(--border);border-radius:6px;padding:6px 10px;cursor:pointer;font-size:16px}
.nav-tabs{display:flex;gap:4px;margin-bottom:20px;flex-wrap:wrap}
.nav-tab{padding:10px 20px;background:var(--bg2);border:1px solid var(--border);border-radius:6px 6px 0 0;cursor:pointer;font-size:14px;color:var(--muted)}
.nav-tab.active{background:var(--bg);color:var(--accent);border-bottom:2px solid var(--accent)}
.main-content{min-height:60vh}
.journey{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:18px;cursor:pointer;transition:all .2s;position:relative}
.card:hover{border-color:var(--accent);transform:translateY(-3px)}
.card.locked{opacity:.5;cursor:not-allowed}
.card.hint{background:rgba(88,166,255,.1);border-color:var(--accent)}
.card h4{color:var(--accent);margin-bottom:8px;font-size:16px}
.card p{font-size:13px;color:var(--muted)}
.card-xp{position:absolute;top:12px;right:12px;background:var(--gold);color:#000;font-size:11px;font-weight:700;padding:2px 8px;border-radius:10px}
.card-type{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted)}
.leaderboard{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:20px;margin-top:30px}
.leaderboard h3{margin-bottom:16px;color:var(--accent)}
.lb-item{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--border)}
.lb-item:last-child{border-bottom:none}
.lb-rank{font-size:18px;font-weight:700;width:30px;text-align:center}
.lb-name{flex:1}
.lb-score{color:var(--gold);font-weight:700}
.lb-me{background:rgba(88,166,255,.1);border-radius:6px}
.modal{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.85);z-index:100;justify-content:center;align-items:center;padding:20px}
.modal.show{display:flex}
.modal-content{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:24px;max-width:820px;width:100%;max-height:90vh;overflow-y:auto}
.modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.close{background:none;border:none;color:var(--muted);font-size:28px;cursor:pointer;line-height:1}
.editor-wrap{display:flex;gap:12px;margin-top:16px;flex-wrap:wrap}
.editor{flex:1;min-width:300px;background:#0d1117;border:1px solid var(--border);border-radius:6px;padding:12px;font-family:'SF Mono',Monaco,monospace;font-size:13px;min-height:160px;resize:vertical;color:var(--text)}
.output{flex:1;min-width:300px;background:#0d1117;border:1px solid var(--border);border-radius:6px;padding:12px;font-family:'SF Mono',Monaco,monospace;font-size:13px;min-height:160px;white-space:pre-wrap;overflow:auto}
.btn{background:var(--accent);color:#000;border:none;padding:10px 20px;border-radius:6px;cursor:pointer;font-weight:600;font-size:14px;transition:background .15s}
.btn:hover{background:#79b8ff}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent)}
.btn.green{background:var(--green);color:#000}
.btn.gold{background:var(--gold);color:#000}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--accent);color:#000;padding:12px 24px;border-radius:8px;z-index:200;animation:slideIn .3s}
@keyframes slideIn{from{opacity:0;transform:translate(-50%,20px)}to{opacity:1;transform:translate(-50%,0)}}
.progress-bar{height:6px;background:var(--border);border-radius:3px;margin-top:8px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--gold));transition:width .3s}
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <div class="logo">⚡ Coddy</div>
    <div class="stats">
      <div class="stat" onclick="showTab('profile')"><div class="stat-val" id="xp">0</div><div class="stat-lbl">XP</div></div>
      <div class="stat streak"><span>🔥</span><span id="streak">0</span><div class="stat-lbl">dias</div></div>
      <div class="stat" onclick="showTab('achievements')"><div class="stat-val" id="rank">Iniciante</div><div class="stat-lbl">Rank</div></div>
      <button class="theme-toggle" onclick="toggleTheme()">🌙</button>
    </div>
  </div>
  <div class="nav-tabs" id="navTabs">
    <div class="nav-tab active" data-tab="journey">📚 Jornada</div>
    <div class="nav-tab" data-tab="leaderboard">🏆 Leaderboard</div>
    <div class="nav-tab" data-tab="achievements">🏅 Conquistas</div>
    <div class="nav-tab" data-tab="playground">💻 Playground</div>
    <div class="nav-tab" data-tab="quiz">📝 Quiz</div>
  </div>
  <div class="main-content" id="mainContent"></div>
</div>
<div class="modal" id="modal">
  <div class="modal-content">
    <div class="modal-header">
      <h4 id="modalTitle">Lição</h4>
      <button class="close" id="closeModal">×</button>
    </div>
    <div id="modalBody"></div>
  </div>
</div>
<div class="toast" id="toast"></div>
<script>
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.style.opacity='1';setTimeout(()=>t.style.opacity='0',3000)}
function todayStr(){return new Date().toISOString().split('T')[0]}
const users=[{name:'Você',xp:0,streak:0,lastDate:todayStr(),completed:[]}];
function getRank(xp){if(xp>=5000)return'Mestre';if(xp>=3000)return'Especialista';if(xp>=1500)return'Avançado';if(xp>=500)return'Intermediário';return'Iniciante';}
function renderLB(){const all=[...users].sort((a,b)=>b.xp-a.xp);document.getElementById('lb').innerHTML=all.map((u,i)=`<div class="lb-item"><div class="rank">${i+1}º</div><div class="name">${u.name}</div><div class="score">${u.xp} XP</div></div>`).join('')}}
function toggleTheme(){document.body.dataset.theme=document.body.dataset.theme==='light'?'dark':'light';showToast('Tema alterado')}
function addXP(amount){const u=document.getElementById('xp');u.textContent=parseInt(u.textContent)+amount;updateRank();updateStreak();renderLB();showToast('+'+amount+' XP')}
function updateRank(){const r=document.getElementById('rank');r.textContent=getRank(parseInt(document.getElementById('xp').textContent));}}
function updateStreak(){const u=document.getElementById('xp');const today=todayStr();if(users[0].lastDate!==today){if(Date.parse(today)-Date.parse(users[0].lastDate)>86400000)users[0].streak=0;users[0].streak++}else{users[0].streak++}users[0].lastDate=today;document.getElementById('streak').textContent=users[0].streak;if(users[0].streak>=7)showToast('Rachada! 7 dias');if(users[0].streak>=30)showToast('Mestre da racha! 30 dias')}
// Dados completos de lições - 3 linguagens com 4 lições cada
const lessons={
python:[
  {id:1,title:'Variáveis',type:'lesson',xp:50,content:'<p>Uma variável é um recipiente que armazena um valor que você pode referência depois no seu programa.</p><p>No Python, você cria uma variável simplesmente atribuindo um valor a um nome.</p><div class="editor-wrap"><textarea class="editor" id="code">nome = "Mundo"\nprint("Olá, " + nome)</textarea><div class="output" id="output"></div></div><button class="btn" onclick="runCode()">Executar</button>'},
  {id:2,title:'Condicionais',type:'challenge',xp:75,content:'<p>Complete o código para verificar se o número é maior que 10:</p><div class="editor-wrap"><textarea class="editor" id="code">num = 15\nif num > 10:\n    print("Maior")</textarea><div class="output" id="output"></div></div><button class="btn" onclick="runCode()">Executar</button>'},
  {id:3,title:'Loop For',type:'challenge',xp:100,content:'<p>Imprima os números de 1 a 5:</p><div class="editor-wrap"><textarea class="editor" id="code">for i in range(1, 6):\n    print(i)</textarea><div class="output" id="output"></div></div><button class="btn" onclick="runCode()">Executar</button>'},
  {id:4,title:'Projeto: Calculadora',type:'project',xp:200,content:'<p>Crie uma calculadora simples que soma dois números:</p><div class="editor-wrap"><textarea class="editor" id="code">a = float(input("Primeiro número: "))\nb = float(input("Segundo número: "))\nprint("Soma:", a + b)</textarea><div class="output" id="output"></div></div><button class="btn" onclick="runCode()">Executar</button>'}
],
js:[
  {id:1,title:'Variáveis JS',type:'lesson',xp:50,content:'<p>Use <code>let</code> para variáveis que mudam de valor e <code>const</code> para constantes.</p><div class="editor-wrap"><textarea class="editor" id="code">let nome = "Coddy"\nconsole.log("Olá, " + nome)</textarea><div class="output" id="output"></div></div><button class="btn" onclick="runCode()">Executar</button>'},
  {id:2,title:'Funções',type:'challenge',xp:75,content:'<p>Crie uma função que dobra um número:</p><div class="editor-wrap"><textarea class="editor" id="code">function dobro(n) {\n  return n * 2\n}\nconsole.log(dobro(5))</textarea><div class="output" id="output"></div></div><button class="btn" onclick="runCode()">Executar</button>'},
  {id:3,title:'Loop While',type:'challenge',xp:100,content:'<p>Imprima números de 1 a 5 usando while:</p><div class="editor-wrap"><textarea class="editor" id="code">let i = 1;\nwhile (i <= 5) {\n  console.log(i);\n  i++</textarea><div class="output" id="output"></div></div><button class="btn" onclick="runCode()">Executar</button>'},
  {id:4,title:'Projeto: Jogo Par ou Ímpar',type:'project',xp:200,content:'<p>Crie um jogo onde o usuário escolhe par ou ímpar e o computador escolhe um número aleatório:</p><div class="editor-wrap"><textarea class="editor" id="code">const escolha = prompt("Par ou Ímpar?").toLowerCase();\nconst numeroComputador = Math.floor(Math.random() * 10) + 1;\nconst resultado = (numeroComputador % 2 === 0) ? "Par" : "Ímpar";\nalerta("O computador escolheu " + numeroComputador + " que é " + resultado);</textarea><div class="output" id="output"></div></div><button class="btn" onclick="runCode()">Executar</button>'}
],
html:[
  {id:1,title:'Estrutura Básica',type:'lesson',xp:50,content:'<p>Todo documento HTML tem uma estrutura padrão com <code><doctype></code>, <code><html></code>, <code><head></code> e <code><body></code>.</p><div class="editor-wrap"><textarea class="editor" id="code"><!doctype html>\n<html lang="pt-br">\n<head>\n  <meta charset="UTF-8">\n  <meta name="viewport" content="width=device-width, initial-scale=1.0">\n  <title>Meu Primeiro Site</title>\n</head>\n<body>\n  <h1>Olá, Mundo!</h1>\n  <p>Este é meu primeiro site</p>\n</body>\n</html></textarea><div class="output" id="output"></div></div><button class="btn" onclick="runCode()">Visualizar</button>'},
  {id:2,title='CSS Básico',type:'challenge',xp:75,content:'<p>Adicione CSS interno para mudar a cor do título para azul e o fundo para amarelto:</p><div class="editor-wrap"><textarea class="editor" id="code"><!doctype html>\n<html lang="pt-br">\n<head>\n  <meta charset="UTF-8">\n  <style>\n    h1 { color: blue; background-color: yellow; padding: 10px; }\n</style>\n</head>\n<body>\n  <h1>Olá, Mundo!</h1>\n</body>\n</html></textarea><div class="output" id="output"></div></div><button class="btn" onclick="runCode()">Visualizar</button>'},
  {id:3,title='Flexbox',type:'challenge',xp:100,content:'<p>Use Flexbox para criar um layout com header, main e footer lado a lado:</p><div class="editor-wrap"><textarea class="editor" id="code"><!doctype html>\n<html lang="pt-br">\n<head>\n  <meta charset="UTF-8">\n  <style>\n    display: flex;\n    flex-direction: column;\n    height: 100vh;\n  </style>\n</head>\n<body>\n  <header>Header</header>\n  <main>Main Content</main>\n  <footer>Footer</footer>\n</body>\n</html></textarea><div class="output" id="output"></div></div><button class="btn" onclick="runCode()">Visualizar</button>'},
  {id:4,title='Projeto: Formulário de Login',type:'project',xp:200,content='<p>Crie um formulário de login simples com validação:</p>'+"<div class=\"editor-wrap\"><textarea class=\"editor\" id=\"code\"><!doctype html>\n<html lang=\"pt-br\">\n<head>\n  <meta charset=\"UTF-8\">\n  <title>Login</title>\n  <style>\n    .form { max-width: 300px; margin: 50px auto; padding: 20px; border: 1px solid #ddd; border-radius: 8px; }\n    .form input { width: 100%; padding: 10px; margin: 5px 0; }\n    .form button { width: 100%; padding: 10px; background: #58a6ff; color: white; border: none; border-radius: 4px; cursor: pointer; }\n  </style>\n</head>\n<body>\n  <div class=\"form\">\n    <h2>Login</h2>\n    <input type=\"text\" placeholder=\"Usuário\">\n    <input type=\"password\" placeholder=\"Senha\">\n    <button>Entrar</button>\n  </div>\n</body>\n</html></textarea><div class=\"output\" id=\"output\"></div></textarea></div><button class=\"btn\" onclick=\"runCode()\">Visualizar</button>'}
]
};
let currentLang='python',showingQuiz=false;
// Render da jornada
function renderJourney(){const list=lessons[currentLang]||[];const completed=users[0].completed||[];document.getElementById('mainContent').innerHTML=list.map(l=>{const alreadyDone=completed.includes(currentLang+'-'+l.id);const cardClass=alreadyDone?'card unlocked':'card '+(l.hint?'hint':'');return`<div class="${cardClass}" onclick="${alreadyDone?'showToast(\"Ja concluido!\")':`openLesson('${currentLang}',${l.id})"`}><h4>${l.title}</h4><p>${l.type==='lesson'?'📖 Lição':l.type==='challenge'?'🎯 Desafio':'🏗️ Projeto'} • ${l.xp} XP</p>${alreadyDone?'<span style="color:var(--gold);font-size:11px;">✓ Concluido</span>':'<span style="color:var(--muted)">Bloqueado</span>'}</div>`}).join('')+`<div style="text-align:center;padding:32px;color:var(--muted)">Total: ${(users[0].completed||[]).length}/${list.length} lições concluídas</div>`}
// Abrir lição
function openLesson(lang,id){const l=lessons[lang].find(x=>x.id===id);if(!l)return;const uIdx=users[0].completed.findIndex(x=>x===lang+'-'+id);if(uIdx>=0){showToast('Já completado!');return}showingQuiz=l.type==='challenge';document.getElementById('modalTitle').textContent=l.title;if(showingQuiz){const q=quizData[lang]?quizData[lang].find(x=>x.id===id):null;if(q){document.getElementById('modalBody').innerHTML=`<p>${q.question}</p>${q.options.map((opt,i)=>`<div style="margin:8px 0;"><label style="display:block;margin-bottom:4px;"><input type="radio" name="quiz${q.id}" value="${i}" style="margin-right:8px;"><span style="padding:4px 8px;background:var(--bg2);border-radius:4px;cursor:pointer;">${opt}</span></label></div>`).join('')}<button class="btn" onclick="checkQuiz(${q.id},${q.answer})">Responder</button><p class="hint">${q.hint}</p>`}else{document.getElementById('modalBody').innerHTML=l.content}}else{document.getElementById('modalBody').innerHTML=l.content}document.getElementById('modal').classList.add('show')}function checkQuiz(qId,correctIdx){const selected=document.querySelector(`input[name="quiz${qId}"]:checked`);if(!selected){showToast('Selecione uma opcao!');return}const idx=parseInt(selected.value);if(idx===correctIdx){addXP(50);showToast('Resposta correta! +50 XP');users[0].completed.push(currentLang+'-'+(lessons[currentLang].find(x=>x.id===id)?.id||0));renderJourney();updateStreak()}else{showToast('Errado! A resposta correta estava na opção correta');}}document.getElementById('closeModal').addEventListener('click',()=>document.getElementById('modal').classList.remove('show'));document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')document.getElementById('modal').classList.remove('show')});document.querySelectorAll('.lang-tab').forEach(tab=>{tab.addEventListener('click',()=>{document.querySelectorAll('.lang-tab').forEach(t=>t.classList.remove('active'));tab.classList.add('active');currentLang=tab.dataset.lang;renderJourney();renderLB()})});renderJourney();renderLB();
// Executar código
function runCode(){const code=document.getElementById('code').value;const out=document.getElementById('output');try{if(currentLang==='python'){try{out.textContent=eval(code)}catch(e){out.textContent='Erro: '+e.message}}else if(currentLang==='js'){const oldLog=console.log;let buf='';console.log=(...args)=>buf+=args.join(' ')+'\n';try{eval(code)}catch(e){buf+='Erro: '+e.message}console.log=oldLog;out.textContent=buf||'(sem saída)'}}else if(currentLang==='html'){out.innerHTML=code.replace(/&/g,'&').replace(/</g,'<').replace(/>/g,'>')}}catch(e){out.textContent='Erro: '+e.message}}}
</script>
</body>
</html>
